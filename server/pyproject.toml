[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008",  # FastAPI's Depends()/File() defaults
  "E501",  # line length is `ruff format`'s job; SQL inside strings may run long
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# server/ on the import path, so `import app` works under the plain `pytest` command (as CI runs it),
# not only under `python -m pytest`, which adds the current folder by itself.
pythonpath = ["."]
